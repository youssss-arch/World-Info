<style>

*{box-sizing:border-box}
html,body{height:100%;margin:0;background:#05060f;color:var(--ink);font-family:'Schibsted Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif;overflow:hidden;-webkit-text-size-adjust:100%}

#sug em.ok{background:rgba(99,130,255,.3);color:#fff}

.panel.on{display:block}

@media(min-width:800px){

}

.layers button span{font-size:1.1rem;line-height:1}
.legend{width:150px;background:var(--card);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:12px;padding:8px 10px}

.panel.on~.layers{display:none}
</style></head><body>

</div>

<div id="warn"></div>

/* ---------- détection du pays sous la souris (calcul léger, sans tester les formes 3D) ---------- */
function inRing(x,y,r){var c=false;for(var i=0,j=r.length-1;i<r.length;j=i++){var xi=r[i][0],yi=r[i][1],xj=r[j][0],yj=r[j][1];if(((yi>y)!==(yj>y))&&(x<(xj-xi)*(y-yi)/(yj-yi)+xi))c=!c}return c}

function ownPicking(){

/* ---------- allègement des frontières détaillées (même aspect, beaucoup moins de points) ---------- */
function dp(pts,tol){var n=pts.length;if(n<5)return pts;var keep=new Uint8Array(n);keep[0]=keep[n-1]=1;var st=[[0,n-1]];
 while(st.length){var s=st.pop(),a=s[0],b=s[1],md=0,mi=-1,ax=pts[a][0],ay=pts[a][1],dx=pts[b][0]-ax,dy=pts[b][1]-ay,L=dx*dx+dy*dy;
  for(var i=a+1;i<b;i++){var px=pts[i][0]-ax,py=pts[i][1]-ay,d;
   if(L===0)d=px*px+py*py;else{var t=Math.max(0,Math.min(1,(px*dx+py*dy)/L)),qx=px-t*dx,qy=py-t*dy;d=qx*qx+qy*qy}
   if(d>md){md=d;mi=i}}
  if(md>tol*tol&&mi>0){keep[mi]=1;st.push([a,mi],[mi,b])}}
 var out=[];for(var k=0;k<n;k++)if(keep[k])out.push(pts[k]);return out}
function simpPoly(pl,tol){var ex=dp(pl[0],tol);var o=[ex.length>=4?ex:pl[0]];for(var h=1;h<pl.length;h++){var r=dp(pl[h],tol);if(r.length>=4)o.push(r)}return o}
function simplify(fs,tol){
 fs.forEach(function(f){var g=f.geometry;if(!g)return;
  if(g.type==="Polygon"){var p=simpPoly(g.coordinates,tol);if(p)g.coordinates=p;else f.geometry=null}
  else{var m=g.coordinates.map(function(pl){return simpPoly(pl,tol)}).filter(Boolean);if(m.length)g.coordinates=m;else f.geometry=null}
  f.__p=null});return fs}

function degrade(){

function perfGuard(){
 if(guarded||slow)return;guarded=true;
 setTimeout(function(){var ds=[],t0=0;
  requestAnimationFrame(function f(ts){if(t0)ds.push(ts-t0);t0=ts;if(ds.length<90)return requestAnimationFrame(f);
   ds.sort(function(x,y){return x-y});if(ds[45]>70)degrade()})},3000)}
function swapProgressive(d){
 var hi=d.features.filter(function(f){return f.properties&&f.properties.ADMIN!=="Antarctica"&&f.geometry});
 simplify(hi,.02);
 var keep=sel&&sel.properties&&sel.properties.ADMIN,names={},i=0,STEP=24,lo=feats;
 (function step(){
  if(slow)return;
  try{
   var part=hi.slice(0,i+STEP);i+=STEP;
   part.forEach(function(f){names[f.properties.ADMIN]=1});
   feats=i>=hi.length?hi:part.concat(lo.filter(function(f){return!names[f.properties.ADMIN]}));
   sel=keep?(feats.filter(function(f){return f.properties.ADMIN===keep})[0]||null):null;hov=null;
   if(G){G.polygonsData(feats.filter(function(f){return f.geometry}));repaint()}
  }catch(e){
   HIERR=String(e&&e.message||e);HIS="erreur";feats=lo;sel=null;
   try{if(G)G.polygonsData(lo.filter(function(f){return f.geometry}))}catch(_){}
   updateQual();return}
  if(i<hi.length)setTimeout(step,60);else{HIS="ok";updateQual();perfGuard()}})()}

var TEMPS=[],LAYER={temp:true,quake:true},ALT=1.9,TIER=0,QUAKES=[];

function tcol(t){
 var S=[[-20,[111,59,160]],[-10,[47,91,216]],[0,[58,160,230]],[10,[60,199,160]],[20,[242,199,68]],[30,[240,138,45]],[40,[214,52,44]]];
 if(t<=S[0][0])return S[0][1];
 for(var i=1;i<S.length;i++)if(t<=S[i][0]){var a=S[i-1],b=S[i],k=(t-a[0])/(b[0]-a[0]);return a[1].map(function(v,j){return Math.round(v+(b[1][j]-v)*k)})}
 return S[S.length-1][1]}
function pill(d){
 if(d.__el)return d.__el;
 var c=tcol(d.t),lum=.299*c[0]+.587*c[1]+.114*c[2],e=document.createElement("div");
 e.className="tp";e.textContent=d.t+"°";e.style.background="rgb("+c.join(",")+")";e.style.color=lum>150?"#10203a":"#fff";
 d.__el=e;return e}
function limitN(){return ALT>2.2?24:ALT>1.5?48:ALT>1.05?80:9999}
function showTemps(){
 if(!G)return;TIER=limitN();
 if(!LAYER.temp||!TEMPS.length){G.htmlElementsData([]);return}
 G.htmlElementsData(TEMPS.filter(function(c){return c.p<TIER})).htmlLat("lat").htmlLng("lng").htmlAltitude(.008).htmlElement(pill)}
function setTemps(cs){TEMPS=cs;showTemps()}
function wl(c){return c<=1?"Dégagé":c<=3?"Nuageux":c<=48?"Brouillard":c<=57?"Bruine":c<=67?"Pluie":c<=77?"Neige":c<=82?"Averses":c<=86?"Averses de neige":"Orage"}
function fetchTemps(){
 var starts=[];for(var i=0;i<CITIES.length;i+=40)starts.push(i);
 Promise.all(starts.map(function(i){
  var ch=CITIES.slice(i,i+40),u="https://api.open-meteo.com/v1/forecast?latitude="+ch.map(function(c){return c[1]}).join(",")+"&longitude="+ch.map(function(c){return c[2]}).join(",")+"&current=temperature_2m,weather_code,wind_speed_10m&timezone=auto";
  return fetch(u).then(function(r){return r.json()}).then(function(d){d=Array.isArray(d)?d:[d];
   return ch.map(function(c,k){var cur=d[k]&&d[k].current;return cur&&cur.temperature_2m!=null?{n:c[0],lat:c[1],lng:c[2],t:Math.round(cur.temperature_2m),c:wl(cur.weather_code||0),w:Math.round(cur.wind_speed_10m||0),p:i+k}:null})})}))
 .then(function(a){setTemps([].concat.apply([],a).filter(Boolean))}).catch(function(){})}

function nearCity(lat,lng){
 if(!LAYER.temp||!TEMPS.length)return null;
 var r=ALT>1.5?4:ALT>1.05?2.2:1.1,best=null,bd=1e9,lim=limitN(),k=Math.cos(lat*Math.PI/180);

function topoToGeo(t){
 var tr=t.transform,sc=tr?tr.scale:[1,1],tl=tr?tr.translate:[0,0];
 var arcs=t.arcs.map(function(a){var x=0,y=0;return a.map(function(p){x+=p[0];y+=p[1];return[x*sc[0]+tl[0],y*sc[1]+tl[1]]})});

 function ring(ix){var r=[];ix.forEach(function(i,k){var a=arc(i);r=r.concat(k?a.slice(1):a)});return r}
 var name=t.objects.countries?"countries":Object.keys(t.objects)[0];
 var fs=t.objects[name].geometries.map(function(g){
  var geom=g.type==="Polygon"?{type:"Polygon",coordinates:g.arcs.map(ring)}:g.type==="MultiPolygon"?{type:"MultiPolygon",coordinates:g.arcs.map(function(p){return p.map(ring)})}:null;
  return{type:"Feature",id:g.id,properties:g.properties||{},geometry:geom}}).filter(function(f){return f.geometry});

function enrich(fs){
 var by={};if(LOD)LOD.features.forEach(function(f){var p=f.properties;by[norm(p.ADMIN||"")]=p;by[norm(p.NAME||"")]=p});
 fs.forEach(function(f){var p=f.properties||(f.properties={}),n=p.name||p.ADMIN;if(!n)return;var m=by[norm(n)];
  if(m)for(var k in m)if(p[k]==null)p[k]=m[k];
  p.ADMIN=(m&&m.ADMIN)||n;p.NAME=p.NAME||n})}
function fetchFirst(urls,i,ok,fail){
 if(i>=urls.length){if(fail)fail();return}
 fetch(urls[i]).then(function(r){return r.json()}).then(function(d){if(d&&d.type==="Topology")d=topoToGeo(d);if(!d||!d.features)throw 0;return d})
  .then(function(d){try{ok(d)}catch(e){HIERR=String(e&&e.message||e);if(fail)fail()}},function(){fetchFirst(urls,i+1,ok,fail)})}
function setFeats(d,keepLow){

 if(keep){sel=feats.filter(function(f){return f.properties.ADMIN===keep})[0]||null}
 if(G){G.polygonsData(feats.filter(function(f){return f.geometry}));repaint()}}
