name: Mise à jour des infos
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  maj:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python build.py
      - run: |
          git config user.name "monde-info-bot"
          git config user.email "bot@users.noreply.github.com"
          git add news.json
          git commit -m "Mise à jour" || exit 0
          git push
