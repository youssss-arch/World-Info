<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Monde Info</title>
<meta name="theme-color" content="#2447f5">
<meta name="description" content="Monde Info : les infos du jour en France, classées par thème, avec météo, électricité, carburants, séismes et plus.">

<style>
:root{--bg:#eef1f7;--card:#fff;--ink:#0f1b3d;--mute:#5a6685;--line:#d9deea;--blue:#2447f5;--red:#e5334b;--up:#0f8a5f;--tagbg:94%;--tagfg:32%;--herol:30%;--bar:rgba(238,241,247,.9)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a0f21;--card:#141b34;--ink:#eef1fb;--mute:#9aa6c8;--line:#26305a;--blue:#7d96ff;--red:#ff6f84;--up:#4cd6a3;--tagbg:24%;--tagfg:82%;--herol:24%;--bar:rgba(10,15,33,.9)}}
:root[data-theme="dark"]{--bg:#0a0f21;--card:#141b34;--ink:#eef1fb;--mute:#9aa6c8;--line:#26305a;--blue:#7d96ff;--red:#ff6f84;--up:#4cd6a3;--tagbg:24%;--tagfg:82%;--herol:24%;--bar:rgba(10,15,33,.9)}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:130px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Schibsted Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif;line-height:1.45;-webkit-text-size-adjust:100%}
.wrap{max-width:680px;margin:0 auto;padding:0 16px}
header{padding:max(18px,env(safe-area-inset-top)) 0 6px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{display:flex;align-items:center;gap:10px}
.flag{display:flex;width:30px;height:22px;border-radius:5px;overflow:hidden;box-shadow:0 0 0 1px var(--line)}
.flag i{flex:1}.flag i:nth-child(1){background:#2447f5}.flag i:nth-child(2){background:#fff}.flag i:nth-child(3){background:#e5334b}
h1{margin:0;font-size:1.9rem;font-weight:800;letter-spacing:-.03em;line-height:1}
.theme{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);width:40px;height:40px;border-radius:12px;font-size:1.1rem}
.sub{margin:8px 0 0;color:var(--mute);font-size:.9rem}
.sub b{color:var(--ink);font-weight:700;text-transform:capitalize}
.rail{display:flex;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px;scroll-padding:0 16px;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
.rail::-webkit-scrollbar{display:none}
.fade{-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 30px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 30px),transparent)}
.live{gap:8px;padding-top:4px;padding-bottom:12px;scroll-snap-type:x proximity}
.pill{flex:none;scroll-snap-align:start;background:var(--card);border-radius:14px;padding:9px 13px;min-width:116px}
.pill span{display:block;font-size:.78rem;color:var(--mute)}
.pill b{display:block;font-size:1.08rem;font-weight:700;letter-spacing:-.01em}
.pill em{font-style:normal;font-size:.8rem;font-weight:500}
.up{color:var(--up)}.down{color:var(--red)}
.sticky{position:sticky;top:0;z-index:5;background:var(--bar);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);padding:max(8px,env(safe-area-inset-top)) 0 10px;border-bottom:1px solid var(--line)}
input{font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 14px;width:100%;margin-bottom:9px}
#tabs{gap:6px;scroll-snap-type:x proximity}
.chip{flex:none;scroll-snap-align:center;font:inherit;font-size:.88rem;font-weight:500;color:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 13px;white-space:nowrap}
.chip small{color:var(--mute);font-size:.78rem;margin-left:3px}
.chip[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip[aria-pressed=true] small{color:inherit;opacity:.7}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
main{padding:16px 0 40px}
.tag{display:inline-block;font-size:.78rem;font-weight:700;border-radius:8px;padding:3px 9px;background:hsl(var(--h) 80% var(--tagbg));color:hsl(var(--h) 60% var(--tagfg))}
a.hc,a.hero{display:block;text-decoration:none;color:#fff;background:hsl(var(--h) 72% var(--herol));border-radius:22px;padding:22px 20px 18px}
.hc .tag,.hero .tag{background:rgba(255,255,255,.2);color:#fff}
.hc .t,.hero .t{font-size:1.5rem;font-weight:800;letter-spacing:-.02em;line-height:1.18;margin:12px 0 16px;text-wrap:balance}
.hc .t{display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden;min-height:6.2rem}
.hc .m,.hero .m{display:flex;justify-content:space-between;font-size:.85rem;opacity:.9}
.car{gap:10px;scroll-snap-type:x mandatory;margin-bottom:8px}
a.hc{flex:none;width:88%;scroll-snap-align:center;scroll-snap-stop:always}
.dots{display:flex;justify-content:center;gap:6px;margin:10px 0 22px}
.dots i{width:7px;height:7px;border-radius:99px;background:var(--line);transition:width .25s,background .25s}
.dots i.on{width:22px;background:var(--blue)}
.sec{margin:0 0 24px}
.sh{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.sh h2{margin:0;font-size:1.2rem;font-weight:800;letter-spacing:-.02em}
.sh button{font:inherit;font-size:.88rem;font-weight:700;color:var(--blue);background:none;border:0;cursor:pointer;padding:6px 0 6px 10px}
.row{gap:10px;scroll-snap-type:x mandatory}
a.rc{flex:none;width:236px;scroll-snap-align:start;text-decoration:none;color:inherit;background:var(--card);border-radius:16px;padding:0 0 12px;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between}
.rc:before{content:"";display:block;height:6px;background:hsl(var(--h) 68% 52%);margin-bottom:12px}
.rc .tag{margin:0 14px}
.rc .t{font-size:1rem;font-weight:700;line-height:1.3;margin:9px 14px 12px;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;min-height:5.2em}
.rc .m{display:flex;justify-content:space-between;gap:8px;font-size:.8rem;color:var(--mute);margin:0 14px}
.rc .m b{color:var(--ink);font-weight:600}
a.hero{margin-bottom:12px}
a.card{display:block;text-decoration:none;color:inherit;background:var(--card);border-radius:14px;padding:13px 15px 12px;margin-bottom:8px;border-left:5px solid hsl(var(--h) 68% 52%)}
.card .t{font-size:1.02rem;font-weight:700;line-height:1.3;margin:7px 0 8px}
.card .m{display:flex;justify-content:space-between;font-size:.82rem;color:var(--mute)}
.card .m b{color:var(--ink);font-weight:600}
.empty{background:var(--card);border-radius:16px;padding:28px 18px;text-align:center;color:var(--mute)}
.empty b{display:block;color:var(--ink);font-size:1.05rem;margin-bottom:4px}
.up2{position:fixed;right:16px;bottom:max(16px,env(safe-area-inset-bottom));width:46px;height:46px;border-radius:50%;border:0;background:var(--blue);color:#fff;font-size:1.2rem;font-weight:800;cursor:pointer;opacity:0;pointer-events:none;transform:translateY(10px);transition:opacity .2s,transform .2s;z-index:8}
.up2.on{opacity:1;pointer-events:auto;transform:none}
footer{color:var(--mute);font-size:.8rem;padding-bottom:max(24px,env(safe-area-inset-bottom))}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.dots i,.up2{transition:none}}

.srow{display:flex;gap:8px;align-items:center;margin-bottom:9px}
.srow input{margin:0;flex:1;min-width:0}
.seg{display:flex;flex:none;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px}
.seg button{font:inherit;font-size:.85rem;font-weight:700;color:var(--mute);background:none;border:0;border-radius:9px;padding:8px 10px;cursor:pointer;white-space:nowrap}
.seg button[aria-pressed=true]{background:var(--blue);color:#fff}
.srow.data input{display:none}.srow.data .seg{flex:1}.srow.data .seg button{flex:1}
.pn{background:var(--card);border-radius:16px;padding:14px 15px;margin-bottom:10px}
.ph{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:8px}
.ph b{font-size:1.1rem;font-weight:800}.ph span{font-size:.88rem;color:var(--mute)}
.air{display:inline-block;font-size:.82rem;font-weight:700;border-radius:8px;padding:3px 9px;margin-bottom:10px;background:hsl(var(--a) 80% var(--tagbg));color:hsl(var(--a) 60% var(--tagfg))}
.air small{font-weight:500}
.days{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;text-align:center}
.days div{background:var(--bg);border-radius:10px;padding:8px 2px;display:flex;flex-direction:column;gap:1px}
.days i{font-style:normal;font-size:1.3rem}.days small{color:var(--mute);font-size:.78rem;text-transform:capitalize}
.big{font-size:2rem;font-weight:800;letter-spacing:-.03em;line-height:1.1}
.big small{font-size:1rem;font-weight:500;color:var(--mute);margin-left:4px}
.mix{margin-top:12px;display:grid;gap:9px}
.mx{display:grid;grid-template-columns:96px 1fr 44px;gap:9px;align-items:center;font-size:.86rem}
.mx i{display:block;height:10px;border-radius:99px;background:var(--bg);overflow:hidden}
.mx i s{display:block;height:100%;border-radius:99px;background:hsl(var(--h) 65% 50%)}
.mx b{text-align:right;font-weight:700}
.mag{flex:none;width:52px;height:52px;border-radius:14px;display:grid;place-items:center;font-weight:800;font-size:1.05rem;color:#fff;background:hsl(var(--h) 75% 42%)}
a.li{display:flex;gap:12px;align-items:center;text-decoration:none;color:inherit;background:var(--card);border-radius:14px;padding:11px 13px;margin-bottom:8px}
a.li .tx{min-width:0;flex:1}.li .t{font-weight:700;line-height:1.3}.li .m{font-size:.82rem;color:var(--mute);margin-top:2px}
.rk{flex:none;width:30px;font-weight:800;color:var(--mute);text-align:center}
.warn{border-left:5px solid var(--red)}
.fx{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.fx div{background:var(--card);border-radius:14px;padding:12px 14px}
.fx span{display:block;font-size:.8rem;color:var(--mute)}.fx b{font-size:1.15rem;font-weight:800}
.form{display:grid;gap:8px;margin-bottom:12px}
.form .r{display:flex;gap:8px}.form .r>*{flex:1;min-width:0}
select{font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 12px}
.btn{font:inherit;font-weight:700;color:#fff;background:var(--blue);border:0;border-radius:12px;padding:11px 14px;cursor:pointer}
.btn.alt{background:var(--card);color:var(--blue);border:1px solid var(--line)}
.tbl{width:100%;border-collapse:collapse;font-size:.88rem}
.tbl td,.tbl th{padding:7px 4px;text-align:right;border-bottom:1px solid var(--line)}
.tbl td:nth-child(2),.tbl th:nth-child(2){text-align:left}
.tbl th{color:var(--mute);font-weight:500;font-size:.78rem}
.sc{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:.9rem}
.sc:last-child{border:0}.sc span:first-child{text-align:right}.sc em{font-style:normal;font-weight:800;background:var(--bg);border-radius:8px;padding:3px 9px}
.src{font-size:.78rem;color:var(--mute);margin:10px 2px 0}
.sub2{font-weight:800;margin:14px 0 6px}

.nav{padding:max(14px,env(safe-area-inset-top)) 0 6px}
.navin{display:flex;flex-wrap:wrap;align-items:center;gap:10px 12px}
.top{flex:1;display:block}
.srow{order:3;flex:1 1 100%;margin:0}
.shell{display:flex;flex-direction:column}
.side{position:sticky;top:0;z-index:5;background:var(--bar);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);padding:max(8px,env(safe-area-inset-top)) 16px 10px;margin:0 -16px;border-bottom:1px solid var(--line)}
.wt{display:none}
.fg{display:grid;gap:8px;grid-template-columns:1fr}
.fg a.card{margin:0}
.dg{display:grid;gap:10px;grid-template-columns:1fr}
.dg>.pn,.dg>a.li{margin:0}
.dg>.src,.dg>.empty,.dg>.form,.dg>#fres{grid-column:1/-1}
.dg>#fres{display:grid;gap:8px;grid-template-columns:1fr}
.dg>#fres a.li{margin:0}
.foot{display:grid;gap:6px;padding-top:20px;border-top:1px solid var(--line)}
@media(min-width:700px){.fg,.dg,.dg>#fres{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}}
@media(min-width:1000px){
 .wrap{max-width:1720px;padding:0 32px}
 .nav{position:sticky;top:0;z-index:20;background:var(--bar);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding:12px 0}
 .navin{flex-wrap:nowrap;gap:20px}
 .top{flex:none}.theme{order:2;flex:none}
 .srow{order:1;flex:1;max-width:720px;margin:0 auto}
 .srow.data{max-width:360px}
 .sub{margin:18px 0 6px;font-size:.95rem}
 .shell{display:grid;grid-template-columns:230px minmax(0,1fr);grid-template-areas:"side live" "side main";column-gap:32px;align-items:start}
 .side{grid-area:side;position:sticky;top:84px;margin:0;padding:0;border:0;background:none;backdrop-filter:none;-webkit-backdrop-filter:none;max-height:calc(100vh - 100px);overflow-y:auto;scrollbar-width:thin}
 .widgets{grid-area:live;margin:0;padding:0 0 14px}
 #list{grid-area:main;padding-top:4px}
 #tabs{flex-direction:column;overflow:visible;gap:2px;margin:0;padding:0;scroll-snap-type:none;-webkit-mask-image:none;mask-image:none}
 #tabs .chip{display:flex;align-items:center;width:100%;text-align:left;border:0;background:none;border-radius:10px;padding:9px 12px;font-size:.94rem}
 #tabs .chip small{margin-left:auto;padding-left:8px}
 #tabs .chip:hover{background:var(--card)}
 #tabs .chip[aria-pressed=true]{background:var(--ink);color:var(--bg)}
 .car{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;overflow:visible;margin:0 0 28px;padding:0;scroll-snap-type:none}
 a.hc{width:auto}
 .hc:first-child{grid-column:span 2;grid-row:span 2;padding:30px 28px 24px}
 .hc:first-child .t{font-size:2.3rem;-webkit-line-clamp:7}
 .hc:not(:first-child) .t{font-size:1.1rem;-webkit-line-clamp:4;min-height:0}
 .hc .t{min-height:0}
 .dots{display:none}
 .row{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));overflow:visible;scroll-snap-type:none;margin:0;padding:0;-webkit-mask-image:none;mask-image:none}
 a.rc{width:auto}
 .rc:nth-child(n+7){display:none}
 .sec{margin-bottom:32px}
 .sh h2{font-size:1.35rem}
 .hero .t{font-size:2.1rem}
 .hero{padding:30px 28px 24px;margin-bottom:14px}
}
@media(min-width:1280px){
 .shell{grid-template-columns:240px minmax(0,1fr) 300px;grid-template-areas:"side main live"}
 .widgets{position:sticky;top:84px;max-height:calc(100vh - 100px);overflow-y:auto;flex-direction:column;gap:8px;padding:0;-webkit-mask-image:none;mask-image:none;scroll-snap-type:none;scrollbar-width:thin}
 .widgets .pill{min-width:0;width:100%;flex:none}
 .wt{display:block;font-weight:800;font-size:1.1rem;margin:0 0 2px}
}
@media(min-width:1700px){.rc:nth-child(n+9){display:none}.rc:nth-child(n+7){display:flex}}
</style></head><body>

</div>

<script>
var C=[["tout","Tout","✨",222],["une","À la une","📰",222],["pres","Président","🏛️",230],["polit","Politique","🗳️",250],["elec","Présidentielle","👤",275],["eco","Économie","💶",160],["crise","Crise économique","📉",8],["crypto","Crypto","₿",38],["bourse","Bourse","📈",175],["sante","Santé","🩺",340],["medic","Médical","💊",320],["meteo","Météo","⛅",200],["catas","Catastrophes","🌪️",20],["accid","Accidents","🚧",0],["faits","Faits divers","⚖️",290],["secu","Sécurité","🛡️",215],["inter","International","🌍",195],["envi","Environnement","🌱",135],["energie","Énergie","⚡",50],["trans","Transports","🚆",25],["tech","Sciences et tech","🔬",260],["sport","Sport","⚽",105],["culture","Culture et médias","🎬",310],["educ","Éducation","🎓",70],["societ","Société","👥",180]];
var CM={};C.forEach(function(c){CM[c[0]]={n:c[1],e:c[2],h:c[3]}});
var SKY={"Dégagé":"☀️","Nuageux":"☁️","Brouillard":"🌫️","Bruine":"🌦️","Pluie":"🌧️","Neige":"❄️","Averses":"🌦️","Averses de neige":"🌨️","Orage":"⛈️"};
var D={items:[]},cur="tout",feed=[],shown=0,STEP=20,root=document.documentElement,io=null;

var DT=[["meteo","Météo 5 jours","⛅"],["elec","Électricité","⚡"],["seisme","Séismes","🌋"],["rappel","Rappels produits","⚠️"],["fuel","Carburants","⛽"],["change","Taux de change","💱"],["riviere","Rivières","🌊"],["wiki","Wikipédia","📖"],["sport","Sport","🏆"]];

function dayn(d){return new Date(d+"T12:00:00").toLocaleDateString("fr-FR",{weekday:"short"})}
function aqi(v){if(v==null)return null;var t=[[20,"Bon",140],[40,"Correct",95],[60,"Moyen",50],[80,"Médiocre",28],[100,"Mauvais",0],[1e9,"Très mauvais",320]];for(var i=0;i<t.length;i++)if(v<=t[i][0])return{l:t[i][1],h:t[i][2]}}
function pMeteo(){var m=D.meteo||[];if(!m.length)return none();
 return m.map(function(c){var a=aqi(c.aqi);return'<div class="pn"><div class="ph"><b>'+esc(c.ville)+"</b><span>"+(SKY[c.ciel]||"🌡️")+" "+c.temp+" °C – "+esc(c.ciel)+", "+c.vent+' km/h</span></div>'+(a?'<div class="air" style="--a:'+a.h+'">Air : '+a.l+" <small>(indice "+c.aqi+")</small></div>":"")+'<div class="days">'+(c.jours||[]).map(function(j){return"<div><small>"+dayn(j.d)+"</small><i>"+(SKY[j.ciel]||"🌡️")+"</i><b>"+j.max+"°</b><small>"+j.min+"°</small></div>"}).join("")+"</div></div>"}).join("")+src("Open-Meteo")}
function pElec(){var e=D.elec;if(!e)return none();var mx=e.mix,tot=0,k;for(k in mx)tot+=mx[k];if(!tot)return none();
 var rows=[["Nucléaire","nucleaire",250],["Hydraulique","hydro",200],["Éolien","eolien",170],["Solaire","solaire",45],["Gaz","gaz",20],["Autres","autres",0]];
 return'<div class="pn"><div class="ph"><b>Consommation</b><span>'+ago(e.heure)+'</span></div><div class="big">'+(e.conso/1000).toFixed(1).replace(".",",")+"<small>GW</small></div>"+(e.co2!=null?'<p class="src" style="margin:6px 0 0">Émissions du réseau : '+e.co2+" g de CO₂ par kWh</p>":"")+'<div class="mix">'+rows.map(function(r){var p=mx[r[1]]/tot*100;return'<div class="mx" style="--h:'+r[2]+'"><span>'+r[0]+"</span><i><s style=\"width:"+p.toFixed(1)+'%"></s></i><b>'+Math.round(p)+" %</b></div>"}).join("")+"</div></div>"+src("RTE – éCO2mix, données nationales en temps réel")}
function pSeisme(){var q=D.seismes||[];if(!q.length)return none();
 return q.map(function(x){var h=x.mag>=7?0:x.mag>=6?20:x.mag>=5?38:55;return'<a class="li" href="'+url(x.u)+'" target="_blank" rel="noopener"><div class="mag" style="--h:'+h+'">'+(x.mag!=null?x.mag.toFixed(1):"?")+'</div><div class="tx"><div class="t">'+esc(x.lieu)+'</div><div class="m">'+ago(x.d)+"</div></div></a>"}).join("")+src("USGS, séismes de magnitude 4,5 et plus des dernières 24 heures")}
function pRappel(){var r=D.rappels||[];if(!r.length)return none();
 return r.map(function(x){return'<a class="li warn" href="'+url(x.u)+'" target="_blank" rel="noopener"><div class="tx"><div class="t">'+esc(x.t)+'</div><div class="m">'+esc([x.cat,x.d].filter(Boolean).join(" – "))+"</div>"+(x.motif?'<div class="m">'+esc(x.motif)+"</div>":"")+(x.risque?'<div class="m"><b>Risque :</b> '+esc(x.risque)+"</div>":"")+"</div></a>"}).join("")+src("RappelConso, site officiel de l’État")}
function pFuel(){return'<div class="form"><div class="r"><select id="fk" aria-label="Carburant"><option value="gazole">Gazole</option><option value="e10">SP95-E10</option><option value="sp98">SP98</option></select><input id="cp" inputmode="numeric" maxlength="5" placeholder="Code postal" aria-label="Code postal"></div><div class="r"><button class="btn" id="fgeo">📍 Autour de moi</button><button class="btn alt" id="fcp">Chercher ce code postal</button></div></div><div id="fres"><div class="empty">Choisis un carburant puis ta position ou un code postal.</div></div>'+src("prix-carburants.gouv.fr via data.economie.gouv.fr, mis à jour toutes les 10 minutes environ")}
function fmtP(v){return Number(v).toFixed(3).replace(".",",")+" €/L"}
function dist(a,b,c,d){var R=6371,r=Math.PI/180,x=(c-a)*r,y=(d-b)*r,h=Math.sin(x/2)*Math.sin(x/2)+Math.cos(a*r)*Math.cos(c*r)*Math.sin(y/2)*Math.sin(y/2);return 2*R*Math.asin(Math.sqrt(h))}
function fuelGo(where,from){var f=document.getElementById("fk").value,res=document.getElementById("fres");res.innerHTML='<div class="empty">Recherche en cours…</div>';
 var u="https://data.economie.gouv.fr/api/explore/v2.1/catalog/datasets/prix-des-carburants-en-france-flux-instantane-v2/records?limit=8&order_by="+f+"_prix%20asc&where="+encodeURIComponent(f+"_prix is not null"+(where?" and "+where:""));
 fetch(u).then(function(r){return r.json()}).then(function(d){var rs=d.results||[];
  if(!rs.length){res.innerHTML='<div class="empty"><b>Aucune station trouvée</b>Essaie un autre carburant ou un autre code postal.</div>';return}
  res.innerHTML=rs.map(function(x,i){var g=x.geom||{},km=(from&&g.lat!=null)?dist(from.lat,from.lon,g.lat,g.lon):null,
   map="https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(g.lat!=null?g.lat+","+g.lon:(x.adresse||"")+" "+(x.cp||"")+" "+(x.ville||""));
   return'<a class="li" href="'+map+'" target="_blank" rel="noopener"><div class="rk">'+(i+1)+'</div><div class="tx"><div class="t">'+fmtP(x[f+"_prix"])+'</div><div class="m">'+esc((x.adresse||"")+", "+(x.cp||"")+" "+(x.ville||""))+(km!=null?" – à "+km.toFixed(1).replace(".",",")+" km":"")+"</div></div></a>"}).join("")})
 .catch(function(){res.innerHTML='<div class="empty"><b>Service indisponible</b>Réessaie dans un instant.</div>'})}
function fuelInit(){document.getElementById("fgeo").onclick=function(){var res=document.getElementById("fres");
  if(!navigator.geolocation){res.innerHTML='<div class="empty">Ton navigateur ne propose pas la localisation. Utilise un code postal.</div>';return}
  navigator.geolocation.getCurrentPosition(function(p){var la=p.coords.latitude,lo=p.coords.longitude;fuelGo("within_distance(geom, geom'POINT("+lo+" "+la+")', 10km)",{lat:la,lon:lo})},function(){res.innerHTML='<div class="empty"><b>Localisation refusée</b>Entre plutôt un code postal.</div>'},{timeout:10000})};
 document.getElementById("fcp").onclick=function(){var c=document.getElementById("cp").value.replace(/\D/g,"");if(c.length!==5){document.getElementById("cp").focus();return}fuelGo('cp="'+c+'"',null)}}
function pChange(){var c=D.change;if(!c)return none();var N={USD:"Dollar américain",GBP:"Livre sterling",CHF:"Franc suisse",JPY:"Yen japonais",CAD:"Dollar canadien",TRY:"Livre turque",CNY:"Yuan chinois"};
 return'<div class="fx">'+Object.keys(c.rates).map(function(k){return"<div><span>"+(N[k]||k)+" ("+k+")</span><b>1 € = "+c.rates[k].toLocaleString("fr-FR",{maximumFractionDigits:4})+"</b></div>"}).join("")+"</div>"+src("Banque centrale européenne, taux du "+esc(c.date||""))}
function pRiv(){var r=D.rivieres||[];var h=r.length?r.map(function(x){return'<div class="pn"><div class="ph"><b>'+esc(x.nom)+"</b><span>"+ago(x.d)+'</span></div><div class="big">'+String(x.niveau).replace(".",",")+"<small>m</small></div></div>"}).join(""):none();
 return h+'<a class="li" href="https://www.vigicrues.gouv.fr/" target="_blank" rel="noopener"><div class="tx"><div class="t">🗺️ Carte officielle des risques d’inondation</div><div class="m">Vigicrues : vigilance crues en France, mise à jour en continu</div></div></a>'+src("Hub’Eau (hauteur d’eau) et Vigicrues")}
function pWiki(){var w=D.wiki||[];if(!w.length)return none();
 return w.map(function(x,i){return'<a class="li" href="https://fr.wikipedia.org/wiki/'+encodeURIComponent(x.a)+'" target="_blank" rel="noopener"><div class="rk">'+(i+1)+'</div><div class="tx"><div class="t">'+esc(x.t)+'</div><div class="m">'+x.v.toLocaleString("fr-FR")+" lectures hier</div></div></a>"}).join("")+src("Wikipédia en français, pages les plus lues hier")}
function pSport(){var s=D.sport;if(!s||(!s.passes.length&&!s.prochains.length&&!s.table.length))return none();
 function sc(l){return l.map(function(e){return'<div class="sc"><span>'+esc(e.h||"")+"</span><em>"+(e.hs!=null&&e.as!=null?e.hs+" – "+e.as:(e.d?e.d.slice(8,10)+"/"+e.d.slice(5,7):"vs"))+"</em><span style=\"text-align:left\">"+esc(e.a||"")+"</span></div>"}).join("")}
 var h="";if(s.passes.length)h+='<div class="pn"><div class="ph"><b>'+esc(s.ligue)+" – derniers résultats</b></div>"+sc(s.passes)+"</div>";
 if(s.prochains.length)h+='<div class="pn"><div class="ph"><b>Prochains matchs</b></div>'+sc(s.prochains)+"</div>";
 if(s.table.length)h+='<div class="pn"><div class="ph"><b>Classement</b></div><table class="tbl"><tr><th>#</th><th>Équipe</th><th>J</th><th>Diff</th><th>Pts</th></tr>'+s.table.map(function(r){return"<tr><td>"+r.rang+"</td><td>"+esc(r.eq)+"</td><td>"+r.j+"</td><td>"+r.diff+"</td><td><b>"+r.pts+"</b></td></tr>"}).join("")+"</table></div>";
 return h+src("TheSportsDB")}
function dataView(){var d=DT.filter(function(x){return x[0]===dcur})[0],F={meteo:pMeteo,elec:pElec,seisme:pSeisme,rappel:pRappel,fuel:pFuel,change:pChange,riviere:pRiv,wiki:pWiki,sport:pSport};
 document.getElementById("list").innerHTML='<div class="sh"><h2>'+d[2]+" "+d[1]+"</h2></div><div class=\"dg\">"+F[dcur]()+"</div>";if(dcur==="fuel")fuelInit()}
function setMode(m){mode=m;document.getElementById("srow").className="srow"+(m==="data"?" data":"");
 document.querySelectorAll("#seg button").forEach(function(b){b.setAttribute("aria-pressed",b.dataset.m===m)});if(io)io.disconnect();render();window.scrollTo({top:0})}
document.querySelectorAll("#seg button").forEach(function(b){b.onclick=function(){setMode(b.dataset.m)}});
function tabs(){var el=document.getElementById("tabs");
 if(mode==="data"){el.innerHTML=DT.map(function(c){return'<button class="chip" role="tab" aria-pressed="'+(c[0]===dcur)+'" data-id="'+c[0]+'">'+c[2]+" "+c[1]+"</button>"}).join("");
  el.querySelectorAll("button").forEach(function(b){b.onclick=function(){dcur=b.dataset.id;render();window.scrollTo({top:0})}})}
 else{var n={};D.items.forEach(function(i){n[i.c]=(n[i.c]||0)+1});
  el.innerHTML=C.map(function(c){var k=c[0]==="tout"?D.items.length:(n[c[0]]||0);return'<button class="chip" role="tab" aria-pressed="'+(c[0]===cur)+'" data-id="'+c[0]+'">'+c[2]+" "+c[1]+(k?"<small>"+k+"</small>":"")+"</button>"}).join("");
  el.querySelectorAll("button").forEach(function(b){b.onclick=function(){go(b.dataset.id)}})}
 var on=el.querySelector('[aria-pressed="true"]');if(on&&innerWidth<1000)on.scrollIntoView({inline:"center",block:"nearest"})}
function cardV(i){return'<a class="card" style="--h:'+M(i.c).h+'" href="'+url(i.u)+'" target="_blank" rel="noopener">'+tag(i.c)+'<div class="t">'+esc(i.t)+'</div><div class="m"><b>'+esc(i.s)+"</b><span>"+ago(i.d)+"</span></div></a>"}
function cardH(i){return'<a class="rc" style="--h:'+M(i.c).h+'" href="'+url(i.u)+'" target="_blank" rel="noopener"><div>'+tag(i.c)+'<div class="t">'+esc(i.t)+'</div></div><div class="m"><b>'+esc(i.s)+"</b><span>"+ago(i.d)+"</span></div></a>"}
function big(i,cls){return'<a class="'+cls+'" style="--h:'+M(i.c).h+'" href="'+url(i.u)+'" target="_blank" rel="noopener">'+tag(i.c)+'<div class="t">'+esc(i.t)+'</div><div class="m"><span>'+esc(i.s)+"</span><span>"+ago(i.d)+"</span></div></a>"}
function home(){
 var seen={},top=[];D.items.forEach(function(i){if(top.length<6&&!seen[i.c]){seen[i.c]=1;top.push(i)}});
 var h='<div class="rail car" id="car">'+top.map(function(i){return big(i,"hc")}).join("")+'</div><div class="dots" id="dots">'+top.map(function(_,k){return"<i"+(k?"":' class="on"')+"></i>"}).join("")+"</div>";
 C.forEach(function(c){if(c[0]==="tout")return;var l=D.items.filter(function(i){return i.c===c[0]}).slice(0,8);if(!l.length)return;
  h+='<section class="sec"><div class="sh"><h2>'+c[2]+" "+c[1]+'</h2><button data-go="'+c[0]+'">Voir tout ('+D.items.filter(function(i){return i.c===c[0]}).length+')</button></div><div class="rail row fade">'+l.map(cardH).join("")+"</div></section>"});
 document.getElementById("list").innerHTML=h;
 document.querySelectorAll("[data-go]").forEach(function(b){b.onclick=function(){go(b.dataset.go)}});
 var car=document.getElementById("car"),dots=document.querySelectorAll("#dots i");
 car.onscroll=function(){var w=car.firstElementChild.offsetWidth+10,k=Math.round(car.scrollLeft/w);dots.forEach(function(d,j){d.className=j===k?"on":""})}}
function more(){var l=document.getElementById("feedend"),g=document.getElementById("fg");if(!l||!g)return;var h=feed.slice(shown,shown+STEP).map(cardV).join("");shown+=STEP;g.insertAdjacentHTML("beforeend",h);if(shown>=feed.length){l.remove();if(io)io.disconnect()}}
function list(q){
 feed=D.items.filter(function(i){return(cur==="tout"||i.c===cur)&&(!q||i.t.toLowerCase().indexOf(q)>-1)});
 var l=document.getElementById("list");
 if(!feed.length){l.innerHTML='<div class="empty"><b>Rien pour le moment</b>Essaie une autre catégorie ou reviens dans quelques minutes.</div>';return}
 var first=feed[0];l.innerHTML='<div class="sh"><h2>'+(q?"Résultats":M(cur).e+" "+M(cur).n)+"</h2></div>"+big(first,"hero")+'<div class="fg" id="fg"></div><div id="feedend" style="height:1px"></div>';
 feed=feed.slice(1);shown=0;if(io)io.disconnect();
 more();var end=document.getElementById("feedend");if(end&&typeof IntersectionObserver==="function"){io=new IntersectionObserver(function(e){if(e[0].isIntersecting)more()},{rootMargin:"500px"});io.observe(end)}else if(end){end.outerHTML='<button class="chip" onclick="more()">Afficher plus</button>'}}
function render(){tabs();if(mode==="data"){dataView();return}var q=document.getElementById("q").value.toLowerCase().trim();if(cur==="tout"&&!q)home();else list(q)}

 (D.crypto||[]).forEach(function(c){var up=c["var"]>=0;h+='<div class="pill"><span>'+esc(c.nom)+"</span><b>"+c.eur.toLocaleString("fr-FR")+' €</b><em class="'+(up?"up":"down")+'">'+(up?"▲ +":"▼ ")+c["var"]+" % sur 24 h</em></div>"});
 (D.meteo||[]).forEach(function(m){h+='<div class="pill"><span>'+esc(m.ville)+"</span><b>"+(SKY[m.ciel]||"🌡️")+" "+m.temp+' °C</b><em>'+esc(m.ciel)+", "+m.vent+" km/h</em></div>"});
 document.getElementById("live").innerHTML=(h?'<div class="wt">En direct</div>':"")+h}
function setTheme(t){root.setAttribute("data-theme",t);try{localStorage.setItem("mi_theme",t)}catch(e){}}
try{var st=localStorage.getItem("mi_theme");if(st)root.setAttribute("data-theme",st)}catch(e){}

addEventListener("scroll",function(){up.classList.toggle("on",scrollY>700)},{passive:true});

 var dd=new Date().toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"});
 document.getElementById("sub").innerHTML="<b>"+dd+"</b> – "+esc(d.country)+(d.updated?", mis à jour "+ago(d.updated):"");live();render()})
 .catch(function(){document.getElementById("sub").textContent="Impossible de charger les infos. Recharge la page."});
document.getElementById("q").oninput=function(){render()};
